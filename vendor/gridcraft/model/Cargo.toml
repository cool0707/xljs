# Vendored from GridCraft (https://github.com/storytold/gridcraft); see ../README.md.
[package]
name = "gridcraft-model"
version = "0.19.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GridCraft document model: workbooks, sheets, cells, styles, tables, charts"
publish = false

[lib]
doctest = false

[dependencies]
gridcraft-core = { path = "../core" }
gridcraft-formula = { path = "../formula" }
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

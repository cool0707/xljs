<!doctype html>
<html lang="ja" class="xljs-app">
<head>
<meta charset="utf-8">
<title>debug</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="debug.css">
</head>
<body>
<!-- A small toast: the whole window is the (custom) title bar, so that it can be dragged. -->
<div class="toast" data-xljs-titlebar>
  <span id="dot" class="dot" aria-hidden="true"></span>
  <div class="text">
    <div id="name"></div>
    <div id="status" class="status"></div>
  </div>
  <button type="button" class="close" data-xljs-window="close" tabindex="-1">&#xE8BB;</button>
</div>
<!-- The script runs in a worker (debug-worker.js); this page relays its calls. -->
<script src="debug-page.js"></script>
</body>
</html>

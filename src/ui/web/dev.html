<!doctype html>
<html lang="ja" class="xljs-app">
<head>
<meta charset="utf-8">
<title>xljs</title>
<link rel="stylesheet" href="fontawesome/css/all.min.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="icons.css">
<link rel="stylesheet" href="dev.css">
</head>
<body>
<!-- The window's own title bar (WindowOptions::custom_title_bar; web/titlebar.js
     styles it and drives the buttons). Hidden outside such a window. -->
<header id="titlebar" class="xljs-titlebar" data-xljs-titlebar hidden>
  <div class="xljs-tb-title"><img src="xljs-logo.png" alt=""><span id="app-title"></span></div>
  <button type="button" tabindex="-1" class="xljs-tb-btn xljs-tb-minimize" data-xljs-window="minimize">&#xE921;</button>
  <button type="button" tabindex="-1" class="xljs-tb-btn xljs-tb-maximize" data-xljs-window="maximize">&#xE922;</button>
  <button type="button" tabindex="-1" class="xljs-tb-btn xljs-tb-close" data-xljs-window="close">&#xE8BB;</button>
</header>
<header id="toolbar">
  <div class="group">
    <button type="button" id="btn-open" class="tool"><i class="ic ic-folder-open"></i><span data-t="open"></span></button>
    <button type="button" id="btn-new" class="tool"><i class="ic ic-file"></i><span data-t="new"></span></button>
    <button type="button" id="btn-folder" class="tool icon" data-tip="showFolder"><i class="ic ic-folder"></i></button>
  </div>
  <div class="group">
    <button type="button" id="btn-run" class="tool run"><i class="ic ic-play"></i><span data-t="run"></span></button>
    <button type="button" id="btn-debug" class="tool"><i class="ic ic-bug"></i><span data-t="debugRun"></span></button>
    <button type="button" id="btn-stop" class="tool stop"><i class="ic ic-square"></i><span data-t="stop"></span></button>
  </div>
  <div class="group">
    <button type="button" id="btn-pack" class="tool" data-tip="packTip"><i class="ic ic-package"></i><span data-t="pack"></span></button>
  </div>
  <div class="group layout">
    <button type="button" id="lay-reset" class="tool icon" data-tip="layoutReset"><i class="ic ic-layout-grid"></i></button>
  </div>
</header>

<!-- The panes are built by dev.js (layout) from the tabs and panels below:
     groups side by side, each with its tabs. -->
<div id="panes"></div>
<div id="stash" hidden>
  <nav id="tabs">
    <button type="button" data-tab="chat" data-tip="tabMoveTip"><i class="ic ic-messages-square"></i><span data-t="tabChat"></span></button>
    <button type="button" data-tab="code" data-tip="tabMoveTip"><i class="ic ic-code"></i><span data-t="tabCode"></span></button>
    <button type="button" data-tab="diff" data-tip="tabMoveTip"><i class="ic ic-git-compare"></i><span data-t="tabDiff"></span><span id="diff-badge" class="badge" hidden><span>1</span></span></button>
    <button type="button" data-tab="preview" data-tip="tabMoveTip"><i class="ic ic-eye"></i><span data-t="tabPreview"></span></button>
    <button type="button" data-tab="history" data-tip="tabMoveTip"><i class="ic ic-history"></i><span data-t="tabHistory"></span></button>
    <button type="button" data-tab="output" data-tip="tabMoveTip"><i class="ic ic-terminal"></i><span data-t="tabOutput"></span><span id="output-badge" class="badge error" hidden><span>!</span></span></button>
    <button type="button" data-tab="tests" data-tip="tabMoveTip"><i class="ic ic-circle-check"></i><span data-t="tabTests"></span><span id="tests-badge" class="badge" hidden><span></span></span></button>
  </nav>

  <div id="panel-chat" class="panel">
    <div id="chat-bar" class="bar">
      <span id="chat-grip" class="grip" data-tip="moveChat"><i class="ic ic-grip-vertical"></i></span>
      <span class="split">
        <button type="button" id="chat-home" class="tool icon"><i class="ic ic-house"></i></button>
        <button type="button" id="chat-home-menu" class="tool icon split-drop" data-tip="chatHomeMenu"><i class="ic ic-chevron-down"></i></button>
      </span>
      <button type="button" id="chat-back" class="tool icon" data-tip="back"><i class="ic ic-arrow-left"></i></button>
      <button type="button" id="chat-forward" class="tool icon" data-tip="forward"><i class="ic ic-arrow-right"></i></button>
      <button type="button" id="chat-reload" class="tool icon" data-tip="reload"><i class="ic ic-rotate-cw"></i></button>
      <input type="text" id="chat-url" spellcheck="false">
      <button type="button" id="chat-intro" class="tool" data-tip="introTip"><i class="ic ic-clipboard"></i><span data-t="intro"></span><i class="ic ic-chevron-down drop"></i></button>
      <button type="button" id="chat-add" class="tool icon" data-tip="tabAdd" hidden><i class="ic ic-plus"></i></button>
    </div>
    <div id="chat-start" class="start">
      <h2 data-t="chatTitle"></h2>
      <p class="muted" data-t="chatLead"></p>
      <div id="services" class="services"></div>
      <form id="chat-url-form" class="url-row">
        <input type="text" id="chat-url-start" spellcheck="false">
        <button type="submit" data-t="go"></button>
      </form>
      <label class="check-row" data-tip="chatDefaultTip"><input type="checkbox" id="chat-default"><span data-t="chatDefault"></span></label>
      <ol class="steps">
        <li data-t="step1"></li>
        <li data-t="step2"></li>
        <li data-t="step3"></li>
      </ol>
      <button type="button" id="chat-intro2"><i class="ic ic-clipboard"></i> <span data-t="intro"></span> <i class="ic ic-chevron-down drop"></i></button>
      <p id="chat-failed" class="error-text" hidden></p>
    </div>
    <div id="chat-view">
      <!-- Over the chat (the browser pane leaves it out): the chat started
           on a service without an assistant set up for xljs. -->
      <div id="agent-hint" class="agent-hint" hidden>
        <button type="button" id="agent-hint-close" class="tool icon agent-hint-close" data-tip="agentHintClose"><i class="ic ic-x"></i></button>
        <p id="agent-hint-text"></p>
        <div class="agent-hint-actions">
          <button type="button" id="agent-hint-prompt" class="primary"><i class="ic ic-wand-sparkles"></i><span data-t="agentHintPrompt"></span></button>
          <label class="check-row"><input type="checkbox" id="agent-hint-never"><span data-t="agentHintNever"></span></label>
        </div>
      </div>
    </div>
  </div>

    <div id="welcome" class="panel start">
      <h2 data-t="welcomeTitle"></h2>
      <p class="muted" data-t="welcomeLead"></p>
      <div class="services">
        <button type="button" id="w-open" class="big"><i class="ic ic-folder-open"></i><span data-t="openScript"></span></button>
        <button type="button" id="w-wizard" class="big"><i class="ic ic-wand-sparkles"></i><span data-t="wzStart"></span></button>
        <button type="button" id="w-port" class="big"><i class="ic ic-file-spreadsheet"></i><span data-t="wzStartPort"></span></button>
      </div>
      <p class="muted small-links">
        <span data-t="templateOnly"></span>
        <button type="button" id="w-new" class="link" data-t="newScript"></button>
        <button type="button" id="w-new-form" class="link" data-t="newForm"></button>
        <button type="button" id="w-new-app" class="link" data-t="newApp"></button>
      </p>
      <h3 data-t="recent" id="recent-title" hidden></h3>
      <ul id="recent" class="recent"></ul>
    </div>

    <!-- What goes into an assistant for xljs (an agent, a Gem, a GPT or a
         project): built by dev.js (agentKit) from what Rust sends. -->
    <div id="agent" class="panel start agent" hidden>
      <div class="agent-head">
        <h2 id="agent-title"></h2>
        <button type="button" id="agent-close" class="tool"><i class="ic ic-x"></i><span data-t="agentClose"></span></button>
      </div>
      <p class="muted" data-t="agentLead"></p>
      <ol id="agent-steps" class="agent-steps"></ol>
      <p id="agent-create-row" hidden><button type="button" id="agent-create"><i class="ic ic-wand-sparkles"></i><span data-t="agentCreate"></span></button></p>
      <section>
        <h3 data-t="agentName"></h3>
        <div class="agent-row"><input type="text" id="agent-name" readonly><button type="button" id="agent-name-copy"><i class="ic ic-clipboard"></i><span data-t="agentCopy"></span></button></div>
        <h3 data-t="agentDescription"></h3>
        <div class="agent-row"><input type="text" id="agent-description" readonly><button type="button" id="agent-description-copy"><i class="ic ic-clipboard"></i><span data-t="agentCopy"></span></button></div>
      </section>
      <section>
        <h3 data-t="agentInstructions"></h3>
        <div id="agent-instructions"></div>
      </section>
      <section>
        <h3 id="agent-files-title"></h3>
        <p class="muted" data-t="agentFilesLead"></p>
        <ul id="agent-files" class="agent-files"></ul>
      </section>
    </div>

    <div id="wizard" class="panel start wizard" hidden>
      <h2 data-t="wzTitle"></h2>
      <p class="muted" data-t="wzLead"></p>

      <section>
        <h3 data-t="wzKind"></h3>
        <label class="opt"><input type="radio" name="wz-kind" value="new" checked> <span data-t="wzKindNew"></span></label>
        <label class="opt"><input type="radio" name="wz-kind" value="port"> <span data-t="wzKindPort"></span></label>
      </section>

      <section class="port-only">
        <h3 data-t="wzBooks"></h3>
        <p class="muted" data-t="wzBooksLead"></p>
        <button type="button" id="wz-books"><i class="ic ic-folder-open"></i> <span data-t="wzChooseBooks"></span></button>
        <ul id="wz-book-list" class="book-list"></ul>
        <label class="opt"><input type="checkbox" id="wz-vba" checked> <span data-t="wzIncludeVba"></span></label>
        <label class="opt"><input type="checkbox" id="wz-sheets" checked> <span data-t="wzIncludeSheets"></span></label>
        <label class="opt indent"><span data-t="wzSampleRows"></span>
          <select id="wz-rows"><option value="0"></option><option value="3">3</option><option value="5">5</option><option value="10">10</option></select>
        </label>
        <label class="opt"><input type="checkbox" id="wz-inline"> <span data-t="wzInline"></span></label>
        <p class="muted indent" data-t="wzPrivacy"></p>
        <button type="button" id="wz-save-text"><i class="ic ic-save"></i> <span data-t="wzSaveText"></span></button>
      </section>

      <section class="port-only">
        <h3 data-t="wzInput"></h3>
        <label class="opt"><input type="radio" name="wz-input" value="yes"> <span data-t="wzYes"></span></label>
        <label class="opt"><input type="radio" name="wz-input" value="no"> <span data-t="wzInputNo"></span></label>
        <label class="opt"><input type="radio" name="wz-input" value="auto" checked> <span data-t="wzAuto"></span></label>
        <input type="text" id="wz-input-note">
        <h3 data-t="wzOutput"></h3>
        <label class="opt"><input type="radio" name="wz-output" value="yes"> <span data-t="wzYes"></span></label>
        <label class="opt"><input type="radio" name="wz-output" value="no"> <span data-t="wzOutputNo"></span></label>
        <label class="opt"><input type="radio" name="wz-output" value="auto" checked> <span data-t="wzAuto"></span></label>
        <input type="text" id="wz-output-note">
      </section>

      <section>
        <h3 data-t="wzFormat"></h3>
        <label class="opt"><input type="radio" name="wz-format" value="form" checked> <span data-t="wzFormatForm"></span></label>
        <label class="opt"><input type="radio" name="wz-format" value="app"> <span data-t="wzFormatApp"></span></label>
        <label class="opt"><input type="radio" name="wz-format" value="script"> <span data-t="wzFormatScript"></span></label>
      </section>

      <section>
        <h3 data-t="wzUsers"></h3>
        <label class="opt"><input type="radio" name="wz-users" value="self"> <span data-t="wzUsersSelf"></span></label>
        <label class="opt"><input type="radio" name="wz-users" value="shared"> <span data-t="wzUsersShared"></span></label>
        <label class="opt"><input type="radio" name="wz-users" value="auto" checked> <span data-t="wzAuto"></span></label>
        <label class="opt"><input type="checkbox" id="wz-ad"> <span data-t="wzUseAd"></span></label>
        <h3 data-t="wzData"></h3>
        <label class="opt"><input type="radio" name="wz-data" value="none"> <span data-t="wzDataNone"></span></label>
        <label class="opt"><input type="radio" name="wz-data" value="keep"> <span data-t="wzDataKeep"></span></label>
        <label class="opt"><input type="radio" name="wz-data" value="auto" checked> <span data-t="wzAuto"></span></label>
      </section>

      <section class="look">
        <h3 data-t="wzLook"></h3>
        <p class="muted" data-t="wzLookLead"></p>
        <div class="look-grid">
          <span data-t="wzTitleBar"></span>
          <div>
            <label class="opt"><input type="radio" name="wz-titlebar" value="system" checked> <span data-t="wzTitleBarSystem"></span></label>
            <label class="opt"><input type="radio" name="wz-titlebar" value="custom"> <span data-t="wzTitleBarCustom"></span></label>
          </div>
          <span data-t="wzAccent"></span>
          <label class="opt"><input type="checkbox" id="wz-accent-on"> <span data-t="wzColorSet"></span> <input type="color" id="wz-accent" value="#1261d1"></label>
          <span data-t="wzBackground"></span>
          <label class="opt"><input type="checkbox" id="wz-background-on"> <span data-t="wzColorSet"></span> <input type="color" id="wz-background" value="#ffffff"></label>
          <span data-t="wzRadius"></span>
          <label class="opt"><select id="wz-radius">
            <option value="none" data-t="wzRadiusNone"></option>
            <option value="small" data-t="wzRadiusSmall"></option>
            <option value="medium" data-t="wzRadiusMedium" selected></option>
            <option value="large" data-t="wzRadiusLarge"></option>
            <option value="full" data-t="wzRadiusFull"></option>
          </select></label>
        </div>
        <div class="row">
          <button type="button" id="wz-look-preview"><i class="ic ic-eye"></i> <span data-t="wzLookPreview"></span></button>
        </div>
        <div id="wz-look-box" hidden>
          <p class="muted app-note" data-t="wzLookAppNote"></p>
          <div class="wz-window" id="wz-window">
            <div class="wz-sysbar"><span class="wz-sysbar-title"></span><span class="wz-caption">&#xE921;</span><span class="wz-caption">&#xE922;</span><span class="wz-caption wz-close">&#xE8BB;</span></div>
            <div class="wz-custombar"><i class="ic ic-table"></i><span class="wz-custombar-title"></span><span class="wz-caption">&#xE921;</span><span class="wz-caption">&#xE922;</span><span class="wz-caption wz-close">&#xE8BB;</span></div>
            <iframe id="wz-look-frame" title="preview"></iframe>
          </div>
          <p class="muted" data-t="wzLookNote"></p>
        </div>
      </section>

      <section>
        <h3 data-t="wzName"></h3>
        <label class="opt"><input type="radio" name="wz-name-mode" value="name"> <span data-t="wzNameGiven"></span></label>
        <input type="text" id="wz-name" class="indent-input">
        <label class="opt"><input type="radio" name="wz-name-mode" value="auto" checked> <span data-t="wzNameAuto"></span></label>
      </section>

      <section>
        <h3 data-t="wzFolder"></h3>
        <div class="url-row">
          <input type="text" id="wz-folder" spellcheck="false">
          <button type="button" id="wz-folder-pick" data-t="wzChoose"></button>
        </div>
      </section>

      <section>
        <h3 id="wz-overview-title"></h3>
        <textarea id="wz-overview" rows="6"></textarea>
        <p id="wz-error" class="error-text" hidden></p>
      </section>

      <section>
        <label class="opt"><input type="checkbox" id="wz-intro"> <span data-t="wzIntro"></span></label>
        <div class="row">
          <button type="button" id="wz-make" class="primary"><i class="ic ic-wand-sparkles"></i> <span data-t="wzMake"></span></button>
          <button type="button" id="wz-cancel" data-t="wzCancel"></button>
        </div>
      </section>

      <section id="wz-result" hidden>
        <h3 data-t="wzPrompt"></h3>
        <p class="muted" id="wz-count"></p>
        <textarea id="wz-text" rows="16" spellcheck="false"></textarea>
        <div class="row">
          <button type="button" id="wz-create" class="primary"><i class="ic ic-clipboard"></i> <span data-t="wzCreate"></span></button>
          <button type="button" id="wz-copy"><span data-t="wzCopyOnly"></span></button>
        </div>
        <p class="muted" data-t="wzAfter"></p>
      </section>
    </div>

    <div id="panel-code" class="panel">
      <div class="bar">
        <button type="button" id="file-drag" class="tool" data-tip="fileDragTip"><i class="ic ic-grip-vertical"></i><i class="ic ic-file-code"></i></button>
        <select id="file-select"></select>
        <span id="file-dir" class="muted"></span>
        <span id="save-state" class="muted"></span>
        <span class="spacer"></span>
        <button type="button" id="btn-format" class="tool" data-tip="formatTip"><i class="ic ic-text-align-start"></i><span data-t="format"></span></button>
        <button type="button" id="btn-notify" class="tool" data-tip="notifyTip"><i class="ic ic-message-square-diff"></i><span data-t="notify"></span></button>
        <button type="button" id="btn-save" class="tool"><i class="ic ic-save"></i><span data-t="save"></span></button>
      </div>
      <div id="attach-bar" class="attach-bar" hidden>
        <span class="muted" data-t="wzAttachLead"></span>
        <button type="button" id="attach-drag" class="tool" data-tip="wzAttachTip"><i class="ic ic-grip-vertical"></i><i class="ic ic-file"></i><span id="attach-name"></span></button>
        <span class="spacer"></span>
        <button type="button" id="attach-close" class="tool" data-tip="wzAttachClose"><i class="ic ic-x"></i></button>
      </div>
      <div class="editor">
        <div id="code"></div>
      </div>
    </div>

    <div id="panel-diff" class="panel">
      <div class="bar">
        <span id="diff-title"></span>
        <select id="diff-target" hidden></select>
        <label id="diff-rename-label" class="check" hidden><input type="checkbox" id="diff-rename" checked> <span id="diff-rename-text"></span></label>
        <span id="diff-stats" class="stats"></span>
        <span class="spacer"></span>
        <button type="button" id="diff-apply" class="primary"><i class="ic ic-check"></i> <span id="diff-apply-label"></span></button>
        <button type="button" id="diff-discard"><span data-t="discard"></span></button>
      </div>
      <p id="diff-empty" class="hint muted" data-t="diffEmpty"></p>
      <div id="diff" class="diff"></div>
    </div>

    <div id="panel-preview" class="panel">
      <div class="bar">
        <span id="preview-title"></span>
        <span class="spacer"></span>
        <button type="button" id="pick-toggle" class="tool" data-tip="pickTip"><i class="ic ic-mouse-pointer-click"></i><span data-t="pick"></span></button>
        <button type="button" id="preview-refresh" class="tool"><i class="ic ic-rotate-cw"></i><span id="preview-refresh-label"></span></button>
      </div>
      <p id="preview-hint" class="hint muted"></p>
      <div id="pick-box" class="pick-box" hidden>
        <p class="muted" data-t="pickLead"></p>
        <ul id="pick-list" class="pick-list"></ul>
        <textarea id="pick-text" rows="3"></textarea>
        <div class="row">
          <button type="button" id="pick-copy" class="primary"><i class="ic ic-clipboard"></i> <span data-t="copyPrompt"></span></button>
          <label class="check"><input type="checkbox" id="pick-full"> <span data-t="includeCode"></span></label>
          <span class="spacer"></span>
          <button type="button" id="pick-clear"><span data-t="pickClear"></span></button>
        </div>
      </div>
      <pre id="preview-error" class="error-box" hidden></pre>
      <iframe id="preview-frame" title="preview" hidden></iframe>
    </div>

    <div id="panel-history" class="panel">
      <div class="bar"><span id="history-title"></span></div>
      <p class="hint muted" data-t="historyLead"></p>
      <ul id="history" class="history"></ul>
    </div>

    <div id="panel-output" class="panel">
      <div class="bar">
        <span id="run-state"></span>
        <span class="spacer"></span>
        <button type="button" id="output-clear" class="tool"><i class="ic ic-eraser"></i><span data-t="clear"></span></button>
      </div>
      <div id="failure" class="failure" hidden>
        <h3 id="failure-title"></h3>
        <button type="button" id="failure-at" class="link" hidden></button>
        <pre id="failure-message" class="error-box"></pre>
        <div class="row">
          <button type="button" id="failure-copy" class="primary"><i class="ic ic-clipboard"></i> <span data-t="copyPrompt"></span></button>
          <label class="check"><input type="checkbox" id="failure-full"> <span data-t="includeCode"></span></label>
        </div>
        <p class="muted" data-t="copyHint"></p>
      </div>
      <pre id="output" class="output"></pre>
    </div>

    <!-- The test cases of the script (xljs test): what each run gives against
         what was approved. The AI never sees the cases, only a difference. -->
    <div id="panel-tests" class="panel">
      <div class="bar">
        <span id="tests-state"></span>
        <span class="spacer"></span>
        <input type="text" id="tests-name" spellcheck="false">
        <button type="button" id="tests-record" class="tool" data-tip="testsRecordTip"><i class="ic ic-plus"></i><span data-t="testsRecord"></span></button>
        <button type="button" id="tests-approve-all" class="tool" hidden><i class="ic ic-check"></i><span data-t="testsApproveAll"></span></button>
        <button type="button" id="tests-run" class="tool"><i class="ic ic-play"></i><span data-t="testsRun"></span></button>
      </div>
      <p id="tests-hint" class="hint muted" data-t="testsNone"></p>
      <pre id="tests-error" class="error-box" hidden></pre>
      <ul id="tests-list" class="tests"></ul>
    </div>
</div>

<footer>
  <span id="status" class="status"></span>
</footer>
<script src="vendor/codemirror/codemirror.js"></script>
<script src="dev-types.js"></script>
<script src="dev-editor.js"></script>
<script src="dev-diff.js"></script>
<script src="dev.js"></script>
</body>
</html>

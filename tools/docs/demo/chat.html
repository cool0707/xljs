<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サンプル AI</title>
<!-- A fictional AI chat for the development mode's demo on the reference
     site (dev-demo.js shows it where the browser pane would be). Not any
     real service: the answer is fixed. -->
<style>
:root { --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb; --soft: #f4f5f7; --accent: #6d4fd8; --code: #f6f8fa; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 14px/1.7 "Yu Gothic UI", "Meiryo UI", "Segoe UI", system-ui, sans-serif; }
header { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
header .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #8b6cf0, #4f8df0); display: grid; place-items: center; color: #fff; font-size: 12px; }
header .note { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--muted); }
#log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 92%; }
.msg.user { align-self: flex-end; background: var(--soft); padding: 8px 12px; border-radius: 14px 14px 4px 14px; }
.msg.ai { align-self: flex-start; }
.msg.ai p { margin: 0 0 8px; }
.welcome { margin: auto 0; text-align: center; color: var(--muted); }
.welcome h1 { font-size: 20px; color: var(--fg); margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; color: var(--fg); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
pre { margin: 6px 0 10px; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 12px/1.55 Consolas, "BIZ UDGothic", ui-monospace, monospace; }
.file { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0 8px; max-width: 340px; }
.file .ic { width: 30px; height: 30px; border-radius: 6px; background: #eef2ff; color: #4f46e5; display: grid; place-items: center; font: 600 10px Consolas, monospace; }
.file .name { flex: 1; font-size: 13px; }
.file .name small { display: block; color: var(--muted); font-size: 11px; }
.file button { border: 0; background: var(--accent); color: #fff; border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.file button:disabled { background: #9ca3af; cursor: default; }
.typing span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: #b7bcc6; animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .3; } }
form { flex: none; display: flex; gap: 8px; margin: 8px 12px 12px; padding: 6px 6px 6px 14px; border: 1px solid var(--line); border-radius: 22px; }
form input { flex: 1; border: 0; outline: none; font: inherit; background: transparent; color: var(--fg); min-width: 0; }
form button { border: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
.hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header><span class="logo">AI</span>サンプル AI<span class="note">体験用の架空のチャット</span></header>
<div id="log">
  <div class="welcome" id="welcome">
    <h1>何を作りますか？</h1>
    <div>xljs の資料を貼ってから頼むと、スクリプトを書いて返します。</div>
    <div class="chips">
      <button type="button" class="chip">単価のない商品を一覧で目立たせて</button>
    </div>
  </div>
</div>
<form id="ask">
  <input id="text" type="text" placeholder="サンプル AI に質問" autocomplete="off">
  <button type="submit" aria-label="送信">↑</button>
</form>
<script>
"use strict";
const log = document.getElementById("log");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const scroll = () => { log.scrollTop = log.scrollHeight; };
let answered = false;

function ask(text) {
  document.getElementById("welcome")?.remove();
  log.insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div>`);
  const typing = document.createElement("div");
  typing.className = "msg ai typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  log.append(typing);
  scroll();
  setTimeout(() => {
    typing.remove();
    const ai = document.createElement("div");
    ai.className = "msg ai";
    if (answered) {
      ai.innerHTML = "<p>（体験版のチャットなので、決まった答えしか返せません）</p><p>実際の開発モードでは、Copilot や ChatGPT など普段使っている AI チャットをこの枠で開いて頼みます。</p>";
    } else {
      answered = true;
      ai.innerHTML = `<p>一覧の表に <code>formats</code> を付けて、単価が空の行を赤い文字にします。変えたのは次の 1 行です。</p>
<pre>{
  name: "list", label: "商品", type: "table", rows: load(), selectable: "single", height: 10,
  columns: ["商品コード", "商品名", "単価", "備考"],
  <b>formats: [{ column: "単価", empty: true, row: true, color: "#9c0006" }],</b>
  ...
}</pre>
<p>直したスクリプトです。</p>
<div class="file"><span class="ic">.xljs</span><span class="name">form-master.xljs<small>スクリプト</small></span><button type="button">ダウンロード</button></div>
<p class="hint">ダウンロードすると、開発モードの［差分］に変更点が出ます。［置き換え］のあと［実行］で確かめてください。</p>`;
      const b = ai.querySelector(".file button");
      b.onclick = () => {
        parent.postMessage({ demo: "download" }, "*");
        b.textContent = "ダウンロード済み";
        b.disabled = true;
      };
    }
    log.append(ai);
    scroll();
  }, 1100);
}

document.querySelector(".chip").onclick = (e) => ask(e.currentTarget.textContent);
document.getElementById("ask").onsubmit = (e) => {
  e.preventDefault();
  const t = document.getElementById("text");
  const v = t.value.trim() || "単価のない商品を一覧で目立たせて";
  t.value = "";
  ask(v);
};
</script>
</body>
</html>

name: Docs

# Builds the reference site from docs/site and types/xljs.d.ts (checking that
# every declaration is documented, that the code examples type-check and that
# the links resolve) and publishes it to GitHub Pages from main.
# Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "types/**"
      - "tools/docs/**"
      - "examples/**"
      - "README.md"
      - "assets/xljs.png"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "types/**"
      - "tools/docs/**"
      - "examples/**"
      - "README.md"
      - "assets/xljs.png"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json
      - name: Build and check the site
        working-directory: tools/docs
        run: |
          npm ci
          node build.mjs
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
